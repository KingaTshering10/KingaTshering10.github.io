[project]
name = "drukagrilink-api"
version = "0.1.0"
description = "DrukAgriLink — Bhutan agricultural aggregation, market coordination, and shared-transport platform (API)"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "pydantic==2.11.4",
  "pydantic-settings==2.9.1",
  "SQLAlchemy==2.0.41",
  "alembic==1.15.2",
  "psycopg[binary]==3.2.9",
  "passlib==1.7.4",
  "PyJWT==2.10.1",
  "python-multipart==0.0.20",
  "email-validator==2.2.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "httpx==0.28.1",
  "ruff==0.11.10",
  "mypy==1.15.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
exclude = ["alembic/", "app/seed/"]  # seed is an API-driven dev script

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:passlib.*"]
