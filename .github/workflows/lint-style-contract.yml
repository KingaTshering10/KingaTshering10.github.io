name: Lint

on:
  push:
    branches:
      - master
      - main
      - v1.0-dev
    paths:
      - "_config.yml"
      - "_data/**"
      - "_pages/**"
      - "assets/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches:
      - master
      - main
      - v1.0-dev
    paths:
      - "_config.yml"
      - "_data/**"
      - "_pages/**"
      - "assets/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  style-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node 🧰
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install JS deps 📦
        run: npm ci

      - name: Run style contract lint 🧷
        run: npm run lint:style-contract
