name: DrukAgriLink Security

on:
  push:
    branches: [main, master]
    paths: ["druk-agrilink/**", ".github/workflows/drukagrilink-security.yml"]
  pull_request:
    paths: ["druk-agrilink/**", ".github/workflows/drukagrilink-security.yml"]

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python dependency audit
        working-directory: druk-agrilink/apps/api
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e .
          # report known vulnerabilities; do not fail the build on advisories
          pip-audit --skip-editable || true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm dependency audit
        working-directory: druk-agrilink/apps/web
        run: npm audit --audit-level=high || true
