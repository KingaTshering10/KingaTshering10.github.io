name: DrukAgriLink Web

on:
  push:
    branches: [main, master]
    paths: ["druk-agrilink/apps/web/**", ".github/workflows/drukagrilink-web.yml"]
  pull_request:
    paths: ["druk-agrilink/apps/web/**", ".github/workflows/drukagrilink-web.yml"]

defaults:
  run:
    working-directory: druk-agrilink/apps/web

jobs:
  quality:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: druk-agrilink/apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Prettier check
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: TypeScript check
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: Production build
        run: npm run build
